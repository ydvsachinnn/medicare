spring.application.name=pepclass
server.port=${PORT:8085}

spring.cloud.discovery.enabled=false
eureka.client.enabled=false

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/pepclass}
spring.data.mongodb.auto-index-creation=true

# Spring Mail SMTP Settings
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@medicareplus.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Disable Spring Cloud Stream/Bus binder noise if RabbitMQ is not installed locally
spring.cloud.stream.enabled=false
spring.cloud.bus.enabled=false
spring.cloud.stream.default-binder=none

# Google Gemini API Key Configuration
google.gemini.api-key=${GOOGLE_GEMINI_API_KEY:}

