server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**,/login,/register,/forgot-password,/verify-otp,/reset-password,/resend-otp,/dashboard,/settings,/patients/**,/doctors/**
          filters:
            - StripPrefix=0

        # Clinical Service Routes
        - id: clinical-service
          uri: lb://CLINICAL-SERVICE
          predicates:
            - Path=/api/clinical/**,/appointments/**,/prescriptions/**,/reports/**,/medicines/**
          filters:
            - StripPrefix=0

        # AI Chatbot Service Routes
        - id: ai-chatbot-service
          uri: lb://AI-CHATBOT-SERVICE
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=0

        # Notification Service Routes
        - id: notification-service
          uri: lb://CLINICAL-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
