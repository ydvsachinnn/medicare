server:
  port: 8083

spring:
  application:
    name: ai-chatbot-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/chatbot_db}
      auto-index-creation: true

# Google Gemini API Key Configuration
google:
  gemini:
    api-key: ${GOOGLE_GEMINI_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
